<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập — Hệ thống Quản lý Ký túc xá</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/shared/styles/design-system.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-brand-mark">KTX</div>
      <div style="text-align:center">
        <div class="fw-bold text-lg">Hệ thống Quản lý KTX</div>
        <div class="text-secondary text-sm">Đăng nhập để tiếp tục</div>
      </div>
    </div>

    <div class="form-row">
      <label>Chọn vai trò (demo)</label>
      <div class="role-picker">
        <div class="role-pick active" data-role="admin">Admin</div>
        <div class="role-pick" data-role="staff">Cán bộ</div>
        <div class="role-pick" data-role="student">Sinh viên</div>
      </div>
    </div>

    <div class="form-row">
      <label for="username">Tên đăng nhập</label>
      <input class="input" id="username" placeholder="vd: admin@ktx.edu.vn" value="admin@ktx.edu.vn">
    </div>
    <div class="form-row">
      <label for="password">Mật khẩu</label>
      <input class="input" id="password" type="password" placeholder="••••••••" value="123456">
    </div>

    <button class="btn btn-primary" style="width:100%" id="loginBtn">Đăng nhập</button>
    <p class="login-demo-note">Bản giao diện demo — không kết nối máy chủ thật. Chọn vai trò rồi bấm Đăng nhập để xem giao diện tương ứng.</p>
  </div>
</div>

<script src="src/features/auth/login.js"></script>
</body>
</html>
