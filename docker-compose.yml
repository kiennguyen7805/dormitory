services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dormitory
      POSTGRES_USER: dormitory
      POSTGRES_PASSWORD: changeme
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dormitory -d dormitory"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      DATABASE_URL: postgresql+psycopg://dormitory:changeme@postgres:5432/dormitory
      SECRET_KEY: local-development-secret-change-before-production
      JWT_ISSUER: dormitory-api
      JWT_AUDIENCE: dormitory-client
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      CORS_ORIGINS: ""
    command:
      - /bin/sh
      - -c
      - >-
        alembic upgrade head &&
        python -m dormitory_infrastructure.identity.seed_cli &&
        uvicorn dormitory_api.main:app --host 0.0.0.0 --port 8000
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/proxy-common.conf:/etc/nginx/conf.d/proxy-common.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/gateway/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      api:
        condition: service_healthy

  adminer:
    image: adminer:latest
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
