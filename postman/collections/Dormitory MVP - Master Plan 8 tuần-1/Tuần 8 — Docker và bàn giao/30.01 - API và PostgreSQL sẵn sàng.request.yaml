$kind: http-request
description: |-
  **Kế hoạch:** Plan!B40 — Chạy migration và kiểm tra /readyz, Swagger trên môi trường demo

  **GET /readyz** · HTTP dự kiến **200**

  Vai trò: Không cần token. Bấm **Send**. Script collection tự đăng nhập và chuẩn bị dữ liệu mẫu riêng (none); không phải chạy tuần trước. URL, body và Authorization điền bằng biến.

  Mỗi Send có thể tạo dữ liệu demo mới trong database. Xem Scripts → Pre-request của collection và Post-response của request; mở Postman Console để xem các request chuẩn bị. Kỳ demo là một ngày, dùng biểu giá hiện hành.
url: "{{baseUrl}}/readyz"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200',()=>pm.response.to.have.status(200));
      if(pm.response.code===200){
      pm.test('Ready',()=>pm.expect(pm.response.json()).to.eql({status:'ready',database:'ok'}));
      }
    language: text/javascript
order: 2000
