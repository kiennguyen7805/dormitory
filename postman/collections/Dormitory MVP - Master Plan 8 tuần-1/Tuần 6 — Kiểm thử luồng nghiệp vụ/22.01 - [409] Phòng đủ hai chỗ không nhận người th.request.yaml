$kind: http-request
name: 22.01 - [409] Phòng đủ hai chỗ không nhận người thứ ba
description: |-
  **Kế hoạch:** Plan!B30 — Kiểm thử phòng đủ/chật, đơn chưa duyệt và hợp đồng trùng

  **POST /api/v1/contracts/{{applicationId}}/assign-room** · HTTP dự kiến **409** · errorCode **ROOM_FULL**

  Vai trò: staff. Bấm **Send**. Script collection tự đăng nhập và chuẩn bị dữ liệu mẫu riêng (full-room); không phải chạy tuần trước. URL, body và Authorization điền bằng biến.

  Mỗi Send có thể tạo dữ liệu demo mới trong database. Xem Scripts → Pre-request của collection và Post-response của request; mở Postman Console để xem các request chuẩn bị. Kỳ demo là một ngày, dùng biểu giá hiện hành.
url: "{{baseUrl}}/api/v1/contracts/{{applicationId}}/assign-room"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "start_date": "{{today}}",
      "end_date": "{{contractEnd}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 409',()=>pm.response.to.have.status(409));
      pm.test('Problem JSON có status, traceId, instance',()=>{const b=pm.response.json();pm.expect(b.status).to.eql(pm.response.code);pm.expect(b.traceId).to.be.a('string').and.not.empty;pm.expect(b.instance).to.include('/api/v1/');pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json');});
      pm.test('errorCode ROOM_FULL',()=>pm.expect(pm.response.json().errorCode).to.eql('ROOM_FULL'));
      if(pm.response.code===409){

      }
    language: text/javascript
order: 2000
