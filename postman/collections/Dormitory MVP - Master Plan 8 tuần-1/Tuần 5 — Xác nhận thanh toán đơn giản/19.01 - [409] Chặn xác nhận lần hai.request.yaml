$kind: http-request
description: |-
  **Kế hoạch:** Plan!B26 — Chặn xác nhận thanh toán lại; sinh viên xem trạng thái đã trả

  **POST /api/v1/bills/{{billId}}/confirm-payment** · HTTP dự kiến **409** · errorCode **BILL_NOT_PAYABLE**

  Vai trò: staff. Bấm **Send**. Script collection tự đăng nhập và chuẩn bị dữ liệu mẫu riêng (paid); không phải chạy tuần trước. URL, body và Authorization điền bằng biến.

  Mỗi Send có thể tạo dữ liệu demo mới trong database. Xem Scripts → Pre-request của collection và Post-response của request; mở Postman Console để xem các request chuẩn bị. Kỳ demo là một ngày, dùng biểu giá hiện hành.
url: "{{baseUrl}}/api/v1/bills/{{billId}}/confirm-payment"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "method": "Cash",
      "reference": "PM-{{runTag}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 409',()=>pm.response.to.have.status(409));
      pm.test('Problem JSON có status, traceId, instance',()=>{const b=pm.response.json();pm.expect(b.status).to.eql(pm.response.code);pm.expect(b.traceId).to.be.a('string').and.not.empty;pm.expect(b.instance).to.include('/api/v1/');pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json');});
      pm.test('errorCode BILL_NOT_PAYABLE',()=>pm.expect(pm.response.json().errorCode).to.eql('BILL_NOT_PAYABLE'));
      if(pm.response.code===409){

      }
    language: text/javascript
order: 3000
