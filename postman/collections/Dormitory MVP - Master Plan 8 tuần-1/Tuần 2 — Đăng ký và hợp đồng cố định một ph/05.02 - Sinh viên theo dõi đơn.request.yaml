$kind: http-request
description: |-
  **Kế hoạch:** Plan!B9 — Sinh viên chọn phòng, gửi đăng ký theo kỳ và theo dõi trạng thái

  **GET /api/v1/housing-applications** · HTTP dự kiến **200**

  Vai trò: student. Bấm **Send**. Script collection tự đăng nhập và chuẩn bị dữ liệu mẫu riêng (application); không phải chạy tuần trước. URL, body và Authorization điền bằng biến.

  Mỗi Send có thể tạo dữ liệu demo mới trong database. Xem Scripts → Pre-request của collection và Post-response của request; mở Postman Console để xem các request chuẩn bị. Kỳ demo là một ngày, dùng biểu giá hiện hành.
url: "{{baseUrl}}/api/v1/housing-applications"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200',()=>pm.response.to.have.status(200));
      if(pm.response.code===200){
      pm.test('Thấy đơn vừa tạo',()=>pm.expect(pm.response.json().some(x=>x.id===pm.variables.get('applicationId'))).to.eql(true));
      }
    language: text/javascript
order: 2000
