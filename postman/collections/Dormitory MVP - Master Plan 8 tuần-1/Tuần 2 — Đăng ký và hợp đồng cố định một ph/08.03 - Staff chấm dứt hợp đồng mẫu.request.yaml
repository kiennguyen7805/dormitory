$kind: http-request
description: |-
  **Kế hoạch:** Plan!B12 — Sinh viên xem hợp đồng; Staff/Admin có thể chấm dứt hợp đồng

  **POST /api/v1/contracts/{{contractId}}/terminate** · HTTP dự kiến **200**

  Vai trò: staff. Bấm **Send**. Script collection tự đăng nhập và chuẩn bị dữ liệu mẫu riêng (contract); không phải chạy tuần trước. URL, body và Authorization điền bằng biến.

  Mỗi Send có thể tạo dữ liệu demo mới trong database. Xem Scripts → Pre-request của collection và Post-response của request; mở Postman Console để xem các request chuẩn bị. Kỳ demo là một ngày, dùng biểu giá hiện hành.
url: "{{baseUrl}}/api/v1/contracts/{{contractId}}/terminate"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "termination_date": "{{today}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200',()=>pm.response.to.have.status(200));
      if(pm.response.code===200){
      pm.test('Terminated',()=>pm.expect(pm.response.json().status).to.eql('Terminated'));
      }
    language: text/javascript
order: 8000
