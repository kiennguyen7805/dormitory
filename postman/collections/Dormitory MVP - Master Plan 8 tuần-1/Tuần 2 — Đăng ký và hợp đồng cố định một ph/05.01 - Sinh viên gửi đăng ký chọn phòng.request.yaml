$kind: http-request
description: |-
  **Kế hoạch:** Plan!B9 — Sinh viên chọn phòng, gửi đăng ký theo kỳ và theo dõi trạng thái

  **POST /api/v1/housing-applications** · HTTP dự kiến **201**

  Vai trò: student. Bấm **Send**. Script collection tự đăng nhập và chuẩn bị dữ liệu mẫu riêng (room); không phải chạy tuần trước. URL, body và Authorization điền bằng biến.

  Mỗi Send có thể tạo dữ liệu demo mới trong database. Xem Scripts → Pre-request của collection và Post-response của request; mở Postman Console để xem các request chuẩn bị. Kỳ demo là một ngày, dùng biểu giá hiện hành.
url: "{{baseUrl}}/api/v1/housing-applications"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "term_code": "{{termCode}}",
      "room_id": "{{roomId}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201',()=>pm.response.to.have.status(201));
      if(pm.response.code===201){

      }
    language: text/javascript
order: 1000
