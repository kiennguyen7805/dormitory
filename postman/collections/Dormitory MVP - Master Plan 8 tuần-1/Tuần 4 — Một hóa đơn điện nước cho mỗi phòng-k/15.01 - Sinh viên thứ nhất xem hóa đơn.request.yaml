$kind: http-request
description: |-
  **Kế hoạch:** Plan!B21 — Sinh viên từng ở phòng trong kỳ xem chung hóa đơn phòng

  **GET /api/v1/bills/{{billId}}** · HTTP dự kiến **200**

  Vai trò: student. Bấm **Send**. Script collection tự đăng nhập và chuẩn bị dữ liệu mẫu riêng (bill); không phải chạy tuần trước. URL, body và Authorization điền bằng biến.

  Mỗi Send có thể tạo dữ liệu demo mới trong database. Xem Scripts → Pre-request của collection và Post-response của request; mở Postman Console để xem các request chuẩn bị. Kỳ demo là một ngày, dùng biểu giá hiện hành.
url: "{{baseUrl}}/api/v1/bills/{{billId}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200',()=>pm.response.to.have.status(200));
      if(pm.response.code===200){
      const bill=pm.response.json();
      pm.test('Hóa đơn phòng, không gắn riêng sinh viên',()=>{pm.expect(bill.room_id).to.eql(pm.variables.get('roomId'));pm.expect(bill.student_id).to.eql(null);pm.expect(bill.contract_id).to.eql(null);});
      pm.test('Hai dòng điện/nước; tổng khớp các dòng',()=>{pm.expect(bill.items).to.have.length(2);pm.expect(bill.items.map(x=>x.item_type).sort()).to.eql(['Electricity','Water']);pm.expect(Number(bill.total_amount)).to.eql(bill.items.reduce((s,x)=>s+Number(x.amount),0));});
      }
    language: text/javascript
order: 3000
