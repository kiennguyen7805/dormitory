$kind: http-request
url: "{{baseUrl}}/api/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{studentEmail}}",
      "full_name": "Postman Student {{runTag}}",
      "password": "Student@123",
      "student_code": "{{studentCode}}",
      "age": 20
    }
scripts:
  - type: afterResponse
    code: pm.test('HTTP 201', () => pm.response.to.have.status(201));
    language: text/javascript
order: 3000
