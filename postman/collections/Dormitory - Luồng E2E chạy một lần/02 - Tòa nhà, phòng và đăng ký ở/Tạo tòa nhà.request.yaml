$kind: http-request
url: "{{baseUrl}}/api/v1/buildings"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: json
  content: |-
    {
      "code": "{{buildingCode}}",
      "name": "Postman {{runTag}}",
      "address": "Postman test",
      "floors": 3
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('buildingId',pm.response.json().id);
    language: text/javascript
order: 1000
