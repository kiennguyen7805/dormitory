$kind: http-request
url: "{{baseUrl}}/api/v1/housing-applications/{{applicationId}}/approve"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{staffToken}}
scripts:
  - type: afterResponse
    code: pm.test('HTTP 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000
