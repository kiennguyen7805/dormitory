$kind: http-request
url: "{{baseUrl}}/api/v1/contracts/{{applicationId}}/assign-room"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{staffToken}}
body:
  type: json
  content: |-
    {
      "start_date": "{{today}}",
      "end_date": "{{periodEnd}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('contractId',pm.response.json().id);
    language: text/javascript
order: 6000
