$kind: http-request
url: "{{baseUrl}}/api/v1/housing-applications"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{studentToken}}
body:
  type: json
  content: |-
    {
      "term_code": "PM-{{runTag}}",
      "room_id": "{{roomId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('applicationId',pm.response.json().id);
    language: text/javascript
order: 4000
