$kind: http-request
url: "{{baseUrl}}/api/v1/bills/{{billId}}/confirm-payment"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{staffToken}}
body:
  type: json
  content: |-
    {
      "method": "Cash",
      "reference": "PM-{{runTag}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      const b=pm.response.json(); pm.test('Hóa đơn đã thanh toán',()=>pm.expect(b.status).to.eql('Paid')); pm.test('Còn nợ bằng 0',()=>pm.expect(b.balance).to.eql(0));
    language: text/javascript
order: 3000
