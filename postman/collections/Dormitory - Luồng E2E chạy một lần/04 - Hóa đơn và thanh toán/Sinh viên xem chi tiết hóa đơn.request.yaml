$kind: http-request
url: "{{baseUrl}}/api/v1/bills/{{billId}}"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{studentToken}}
scripts:
  - type: afterResponse
    code: pm.test('HTTP 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 2000
