$kind: collection
description: Đủ 8 tuần, 32 công việc từ sheet Plan. Chọn No Environment, mở bất kỳ request → Send. Tự
  lấy token, tạo dữ liệu phụ thuộc riêng mỗi lần. Có thể Run toàn collection, gồm ca lỗi dự kiến 4xx.
  Cần Docker/gateway và tài khoản demo đã seed. Mỗi Send có thể thêm dữ liệu demo. Tuần 7/8 kiểm tra HTTP
  phục vụ tài liệu/Docker, không build hoặc chỉnh tài liệu qua HTTP. Checklist Excel còn logout nhưng
  backend đã bỏ endpoint này. Người xác nhận thanh toán lưu nội bộ, BillRead chưa công khai trường này.
variables:
  baseUrl: http://localhost:8081
  adminEmail: admin@dormitory.local
  adminPassword: Admin@123
  staffEmail: staff@dormitory.local
  staffPassword: Staff@123
  studentPassword: Student@123
  access_token: ''
  refresh_token: ''
