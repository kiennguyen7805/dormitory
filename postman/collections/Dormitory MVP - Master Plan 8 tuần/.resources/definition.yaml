        "setup": "none"
      },
      "29.01 - Gateway Docker đang sống": {
        "role": null,
        "setup": "none"
      },
      "30.01 - API và PostgreSQL sẵn sàng": {
        "role": null,
        "setup": "none"
      },
      "30.02 - Swagger môi trường demo": {
        "role": null,
        "setup": "none"
      },
      "31.01 - Kiểm thử đầu cuối trên dữ liệu demo mới": {
        "role": "student",
        "setup": "paid"
