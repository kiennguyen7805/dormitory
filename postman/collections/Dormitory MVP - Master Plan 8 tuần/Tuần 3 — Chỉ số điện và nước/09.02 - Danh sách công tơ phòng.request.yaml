$kind: http-request
description: |-
  **Kế hoạch:** Plan!B14 — Duy trì hai tiện ích điện và nước; mỗi phòng có một công tơ cho từng loại

  **GET /api/v1/meters?room_id={{roomId}}** · HTTP dự kiến **200**

  Vai trò: staff. Bấm **Send**. Script collection tự đăng nhập và chuẩn bị dữ liệu mẫu riêng (room); không phải chạy tuần trước. URL, body và Authorization điền bằng biến.

  Mỗi Send có thể tạo dữ liệu demo mới trong database. Xem Scripts → Pre-request của collection và Post-response của request; mở Postman Console để xem các request chuẩn bị. Kỳ demo là một ngày, dùng biểu giá hiện hành.
url: '{{baseUrl}}/api/v1/meters?room_id={{roomId}}'
method: GET
auth:
  type: bearer
  credentials:
    token: '{{access_token}}'
order: 2000
scripts:
- type: afterResponse
  code: |-
    pm.test('HTTP 200',()=>pm.response.to.have.status(200));
    if(pm.response.code===200){

    }
  language: text/javascript
