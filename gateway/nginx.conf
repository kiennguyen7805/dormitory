worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format gateway '$remote_addr - $request_id [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" upstream=$upstream_addr '
                       'upstream_status=$upstream_status request_time=$request_time';
    access_log /var/log/nginx/access.log gateway;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 2m;
    gzip on;
    gzip_types application/json application/problem+json text/plain text/css application/javascript;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_status 429;

    upstream dormitory_api {
        server api:8000;
        keepalive 16;
    }

    server {
        listen 80;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Request-ID $request_id always;

        location = /gateway/healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"gateway"}';
        }

        location ~ ^/api/v1/auth/(login|register)$ {
            limit_req zone=auth_limit burst=10 nodelay;
            include /etc/nginx/conf.d/proxy-common.conf;
            proxy_pass http://dormitory_api;
        }

        location /api/ {
            limit_req zone=api_limit burst=60 nodelay;
            include /etc/nginx/conf.d/proxy-common.conf;
            proxy_pass http://dormitory_api;
        }

        location / {
            include /etc/nginx/conf.d/proxy-common.conf;
            proxy_pass http://dormitory_api;
        }
    }
}
